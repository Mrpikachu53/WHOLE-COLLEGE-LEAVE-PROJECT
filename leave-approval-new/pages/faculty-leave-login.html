<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Faculty Leave Login | Leave Approval</title>
  <link rel="stylesheet" href="style.css?v=3.4.0">
</head>
<body data-page="login" data-portal="faculty-leave">
  <main class="auth-shell">
    <div class="auth-box">
      <p class="eyebrow">FIRST HOUR PERMISSION &amp; LEAVE APPROVAL</p>
      <h1>Faculty Leave Login</h1>
      <p>Sign in to apply for your own leave or first-hour permission.</p>
      <form id="login-form">
        <input type="hidden" id="role" name="role" value="faculty">
        <label for="email">Email Address</label>
        <input type="email" id="email" name="email"
          placeholder="Enter your email" autocomplete="username"
          maxlength="254" required>
        <label for="password">Password</label>
        <div class="password-field">
          <input type="password" id="password" name="password"
            placeholder="Enter your password"
            autocomplete="current-password" maxlength="128" required>
          <button type="button" class="password-toggle"
            data-password-target="password" data-field-label="password"
            aria-controls="password" aria-label="Show password"
            title="Show password">
            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/>
              <circle cx="12" cy="12" r="3"/>
              <path class="eye-slash" d="M3 3 21 21" hidden/>
            </svg>
          </button>
        </div>
        <p class="right">
          <a href="forgot-password.html?role=faculty&amp;portal=faculty-leave">Forgot password?</a>
        </p>
        <button id="submit-button" type="submit">Login for Faculty Leave</button>
      </form>
      <p id="message" role="status"></p>
      <p>New here? <a href="signup.html?role=faculty&amp;portal=faculty-leave">Create an account</a></p>
      <p class="note">
        Use your own email and password.
        The faculty invitation code is needed only when creating an account.
      </p>
      <p><a href="faculty-options.html">Back to Faculty Options</a></p>
    </div>
  </main>
  <script src="password-visibility.js?v=3.4.0" defer></script>
  <script src="common.js?v=3.4.0" defer></script>
  <script src="auth.js?v=3.4.0" defer></script>
</body>
</html>
